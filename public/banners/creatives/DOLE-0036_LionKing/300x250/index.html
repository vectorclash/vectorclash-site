    <meta charset="utf-8">
    <style media="screen">
      .banner {
        position: absolute;
        left: 0;
        top: 0;
        width: 300px;
        height: 250px;
        overflow: hidden;
        background-color: #008bcd;
        cursor: pointer;
      }

      .full-frame-element {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        display: none;
        background-size: 100%;
      }

      .border {
        position: absolute;
        width: 100%;
        height: 100%;
        border: 1px solid black;
        box-sizing: border-box;
        -moz-box-sizing: border-box;
        -webkit-box-sizing: border-box;
        z-index: 100;
      }

      .frame {
        position: absolute;
        width: 100%;
        height: 100%;
        z-index: 50;
      }

      .frame1-bg {
        display: block;
        background-image: url(images/frame1-bg.png);
        z-index: 0;
      }

      .frame1-text {
        background-image: url(images/frame1-text.png);
        z-index: 1;
      }

      .frame2-bg {
        background-image: url(images/frame2-bg.png);
        z-index: 0;
      }

      .frame2-text {
        z-index: 2;
      }

      .frame2-text svg {
        position: absolute;
        right: -29px;
        bottom: 6px;
        transform: scale(0.74);
      }

      .frame3-bg {
        background-image: url(images/frame3-bg.png);
        z-index: 0;
      }

      .frame3-text {
        z-index: 1;
      }

      .frame3-text svg {
        position: absolute;
        bottom: 16px;
      }

      .end-frame-logo {
        background-image: url(images/end-frame-logo.png);
        z-index: 1;
      }

      .end-frame-text {
        background-image: url(images/end-frame-text.png);
        z-index: 1;
      }

      .end-frame-cta {
        background-image: url(images/end-frame-cta.png);
        z-index: 1;
      }

      .end-frame-cta-over {
        display: block;
        opacity: 0;
        background-image: url(images/end-frame-cta-over.png);
        z-index: 2;
      }
    </style>

      var clickTag = 'http://www.dole.com'

          	c-4,3.1-12.7,3.2-17,0.3c-7.2-4.8-4.9-19.4-5.3-27.4c-0.5-10.3-1.3-20.4-2.1-30.6c-1.3-16.5-0.5-33-2.5-49.4c-1-8.1-6.8-27.1-1-34
          	c3.7-4.5,13.2-3.9,17.4-0.9c6.4,4.5,6,14.6,6.8,21.5C1332.2,106.4,1334.1,126.6,1333.8,146.7z"/>
          <path class="st0" d="M1382.5,157.9c-1.6,4.7,0.3,12.4,0.3,17.4c0,8.6-0.4,17.2-0.7,25.7c-0.2,6.2,0.9,13.2-5.1,16.9
          	c-4.3,2.7-12.9,2-16.9-1.2c-6.8-5.4-3.1-19.8-2.8-27.8c0.4-10.3,0.5-20.4,0.5-30.7c0.1-16.5,2.4-32.9,1.9-49.5
          	c-0.3-8.1-4.4-27.5,2-34c4.1-4.1,13.5-2.7,17.5,0.6c6,5,4.7,15.1,4.9,22C1384.5,117.5,1384.7,137.9,1382.5,157.9z"/>

        <div class="frame3-bg full-frame-element"></div>
      </div>
      <div class="end-frame frame">
        <div class="end-frame-text full-frame-element"></div>
        <div class="end-frame-logo full-frame-element"></div>
        <div class="end-frame-cta-over full-frame-element"></div>
        <div class="end-frame-cta full-frame-element"></div>
      </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/2.1.3/TweenMax.min.js"></script>
    <script>
      var wiggleAmount = 4
      var animationRunning = true
      var banner

      function init() {
        banner = document.querySelector('.banner')

        wiggleText()
        animate()

        banner.addEventListener('click', onBannerClick)
      }

      function animate() {
        TweenMax.from('.frame1-text', 1, {
          y: 20,
          alpha: 0,
          ease: Quad.easeInOut,
          onStart: enableElement,
          onStartParams: ['.frame1-text']
        })

        // animate out frame 1

        TweenMax.to('.frame1-bg', 1, {
          x: banner.clientWidth,
          ease: Quad.easeInOut,
          delay: 3
        })

        TweenMax.to('.frame1-text', 1, {
          x: banner.clientWidth + 50,
          ease: Quad.easeInOut,
          delay: 3
        })

        // animate in frame 2

        TweenMax.from('.frame2-bg', 1, {
          x: -banner.clientWidth,
          ease: Quad.easeInOut,
          delay: 3,
          onStart: enableElement,
          onStartParams: ['.frame2-bg']
        })

        TweenMax.from('.frame2-text', 1, {
          alpha: 0,
          x: -banner.clientWidth - 50,
          ease: Quad.easeInOut,
          delay: 3,
          onStart: enableElement,
          onStartParams: ['.frame2-text']
        })

        // animate out frame 2

        TweenMax.to('.frame2-bg', 1, {
          x: banner.clientWidth,
          ease: Quad.easeInOut,
          delay: 6
        })

        TweenMax.to('.frame2-text', 1, {
          x: banner.clientWidth + 50,
          ease: Quad.easeInOut,
          delay: 6
        })

        // animate in frame 3

        TweenMax.from('.frame3-bg', 1, {
          x: -banner.clientWidth,
          ease: Quad.easeInOut,
          delay: 6,
          onStart: enableElement,
          onStartParams: ['.frame3-bg']
        })

        TweenMax.from('.frame3-text', 1, {
          alpha: 0,
          x: -banner.clientWidth - 50,
          ease: Quad.easeInOut,
          delay: 6,
          onStart: enableElement,
          onStartParams: ['.frame3-text']
        })

        TweenMax.from('.frame3-text-svg', 1, {
          x: -banner.clientWidth,
          ease: Quad.easeInOut,
          delay: 6,
          onStart: enableElement,
          onStartParams: ['.frame3-text-svg']
        })

        // animate out frame 3

        TweenMax.to('.frame3-bg', 1, {
          x: banner.clientWidth,
          ease: Quad.easeInOut,
          delay: 9
        })

        TweenMax.to('.frame3-text', 1, {
          x: banner.clientWidth + 50,
          ease: Quad.easeInOut,
          delay: 9
        })

        // animate in end frame

        TweenMax.from('.end-frame-logo', 1, {
          x: -banner.clientWidth,
          ease: Quad.easeInOut,
          delay: 9,
          onStart: enableElement,
          onStartParams: ['.end-frame-logo']
        })

        TweenMax.to('.end-frame-logo', 1, {
          scale: 0.65,
          x: -83,
          y: 60,
          ease: Quad.easeInOut,
          delay: 11
        })

        TweenMax.from('.end-frame-text', 1.5, {
          x: banner.clientWidth,
          ease: Quad.easeInOut,
          delay: 11,
          onStart: enableElement,
          onStartParams: ['.end-frame-text']
        })

        TweenMax.from('.end-frame-cta', 0.5, {
          y: 10,
          alpha: 0,
          ease: Quad.easeInOut,
          delay: 12.5,
          onStart: enableElement,
          onStartParams: ['.end-frame-cta'],
          onComplete: function() {
            animationRunning = false
            banner.addEventListener('mouseover', onBannerOver)
            banner.addEventListener('mouseout', onBannerOut)
          }
        })
      }

      function enableElement(element) {
        TweenMax.set(element, {
          display: 'block'
        })
      }

      function wiggleText() {
       var svgs = document.querySelectorAll('svg')

       for (var i = 0; i < svgs.length; i++) {
         for (var j = 0; j < svgs[i].children.length; j++) {
           var ranX = -(wiggleAmount / 2) + Math.random() * wiggleAmount
           var ranY = -(wiggleAmount / 2) + Math.random() * wiggleAmount

           TweenMax.to(svgs[i].children[j], 0.01, {
             x: ranX,
             y: ranY,
             ease: Quad.easeInOut
           })
         }
       }

       if(animationRunning) {
         TweenMax.delayedCall(0.08, wiggleText)
       }
      }

      function onBannerOver(event) {
        TweenMax.to('.end-frame-cta', 0.3, {
          alpha: 0
        })

        TweenMax.to('.end-frame-cta-over', 0.3, {
          alpha: 1
        })
      }

      function onBannerOut(event) {
        TweenMax.to('.end-frame-cta', 0.2, {
          alpha: 1
        })

        TweenMax.to('.end-frame-cta-over', 0.2, {
          alpha: 0
        })
      }

      function onBannerClick(event) {
        window.open(clickTag)
      }

      window.addEventListener('load', init)
    </script>
  </body>
</html>
