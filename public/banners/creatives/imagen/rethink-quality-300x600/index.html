<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="ad.size" content="width=300,height=600">
  <style>
    :root {
      --primary-color: #F78614;
      --secondary-color: #FFFFFF;
    }

    @font-face {
      font-family: "TT Norms Pro";
      src: url("assets/fonts/regular.woff2");
      font-weight: 400;
    }

    @font-face {
      font-family: "TT Norms Pro";
      src: url("assets/fonts/bold.woff2");
      font-weight: 700;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    #banner-container {
      position: relative;
      width: 300px;
      height: 600px;
      background-color: #FFFFFF;
      overflow: hidden;
      cursor: pointer;
      border: 1px solid rgba(0, 0, 0, 0.5);
    }

    #banner-container * {
      user-select: none;
    }

    /* bottom bar styles */

    .bottom-bar {
      position: absolute;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      padding: 22px 0;
      height: 142px;
      bottom: 0;
      left: 0;
      background-color: white;
      z-index: 10;
    }

    .bottom-bar .logo {
      width: 208px;
    }

    .bottom-bar .cta {
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: "TT Norms Pro", sans-serif;
      font-weight: 400;
      font-size: 16px;
      line-height: 16px;
      letter-spacing: -0.16px;
      color: var(--secondary-color);
      padding: 12px 15px;
      background-color: var(--primary-color);
    }

    .bottom-bar .cta svg {
      width: 10px;
      margin-left: 10px;
    }

    .bottom-bar .cta path {
      fill: var(--secondary-color);
    }

    /* text and lambda styles */

    .text-lambda {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      z-index: 5;
    }

    .text-lambda .lambda {
      position: absolute;
      height: 600px;
      /* right: 127px; */
      top: 0;
      right: -300px;
      fill: var(--primary-color);
      z-index: 0;
    }
    

    .text-lambda .text-one {
      position: absolute;
      width: 300px;
      top: 32px;
      left: 24px;
      font-family: "TT Norms Pro", sans-serif;
      font-weight: 400;
      font-size: 37px;
      line-height: 48px;
      letter-spacing: -0.37px;
      color: #FFFFFF;
      z-index: 1;
      opacity: 0;
    }

    .text-lambda .text-two {
      position: absolute;
      width: 300px;
      top: 32px;
      left: 27px;
      opacity: 0;
      font-family: "TT Norms Pro", sans-serif;
      font-weight: 400;
      font-size: 37px;
      letter-spacing: -0.7px;
      color: #FFFFFF;
      z-index: 1;
    }

    /* background image styles */

    .background-image {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      z-index: 0;
    }

    .background-image img {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
    }

    .background-image .foreground {
      z-index: 3;
    }

    .background-image .grid-container {
      position: absolute;
      width: 100%;
      height: 520px;
      top: 0;
      left: 0;
      z-index: 2;
      opacity: 0;
    }

    .background-image .grid-container svg {
      transform-origin: center center;
    }

    .background-image .grid-container svg line {
      stroke-width: 0.25;
      stroke: #FFFFFF;
    }

    .background-image .grid-background {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      background-color: var(--primary-color);
      opacity: 0;
      z-index: 1;
    }

    .background-image .background {
      z-index: 0;
    }
  </style>
  <script>
    // clicktag code
    var clickTag = "https://www.google.com";
  </script>
</head>

<body>
  <div id="banner-container">
    <div class="bottom-bar">
      <img class="logo" src="assets/images/logo.svg">
      <div class="cta">
        Rethink Quality
        <svg class="cta-arrow" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 7.4 8.5">
          <path d="M0,8.5V0l7.4,4.3L0,8.5z" />
        </svg>
      </div>
    </div>

    <div class="text-lambda">
      <div class="text-one">The
        <strong><span>AI-</span><span>enhanced-</span><span>to-</span><span>increase-</span><span>diagnostic-</span><span>accuracy</span></strong>
        diagnostics platform.</div>
      <div class="text-two">Rethink<br/>Diagnostics</div>
      <svg class="lambda" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 587.5 305">
        <polygon points="587.5,0 411.8,305 299.1,305 299.1,0 " />
        <rect width="305" height="305" />
      </svg>
    </div>

    <div class="background-image">
      <img class="foreground" src="assets/images/primary-foreground.png">
      <div class="grid-container"></div>
      <div class="grid-background"></div>
      <img class="background" src="assets/images/primary-background.png">
    </div>
  </div>

  </script>
  <script>
    //main code here
    const nsURI = "http://www.w3.org/2000/svg";
    const dotWidth = 42;
    const dotHeightAdjust = 0.865;
    const dotOffset = -14;
    const mainContainer = document.querySelector("#banner-container");
    let arrowAnimating = false;
    let mainTL = new gsap.timeline();

    function init() {
      gsap.registerPlugin(DrawSVGPlugin);
      gsap.registerPlugin(SplitText);
      let container = document.querySelector(".grid-container");
      buildSVGGrid(container);

      mainContainer.addEventListener('click', () => {
        window.open(clickTag);
      });

      animate();
    }

    function animate() {
      // animate frame 1
      let textOneSplit = new SplitText(".text-one", {type: "words"});

      for (let i = 0; i < textOneSplit.words.length; i++) {
        let word = textOneSplit.words[i];
        word.style.transformOrigin = "bottom middle";
      }

      mainTL.from(textOneSplit.words, {
        duration: 0.35, 
        alpha: 0,
        scale: 0.9,
        y: 15,
        stagger: 0.25,
        ease: "quad.inOut",
        onStart: () => {
          gsap.set(".text-one", {
            alpha: 1
          })
        }
      });

      mainTL.to(".text-one", {
        duration: 1,
        x: -320,
        alpha: 0,
        ease: "quad.inOut"
      }, "+=1.5")

      mainTL.to(".lambda", {
        duration: 1,
        right: "-2px",
        ease: "quad.inOut"
      }, "-=1");

      // animate frame 2

      mainTL.to(".text-two", {
        duration: 1,
        alpha: 1,
        ease: "quad.inOut"
      });

      mainTL.to(".grid-background", {
        duration: 1,
        alpha: 0.25,
        ease: "quad.inOut"
      }, "+=0.5");

      let lineTl = new gsap.timeline();
      lineTl.from("line", {
        drawSVG: 0,
        duration: 0.2,
        ease: "quad.out",
        stagger: 0.05,
        onStart: ()=> {
          gsap.set(".grid-container", {
            alpha: 1
          })
        }
      });
      lineTl.totalDuration(2);
      mainTL.add(lineTl, "-=1");

      mainTL.to(".cta-arrow", {
        duration: 0.15,
        x: 5,
        ease: "quad.inOut",
        repeat: 3,
        yoyo: true,
        onComplete: () => {
          mainContainer.addEventListener("mouseenter", onMouseEnter);
          mainContainer.addEventListener("mouseleave", onMouseLeave);
        }
      }, "+=1");
    }

    function buildSVGGrid(container) {
      const width = container.getBoundingClientRect().width;
      const height = container.getBoundingClientRect().height;
      const dotAmount = Math.ceil(width / dotWidth);
      const lineAmount = Math.ceil(height / dotWidth);

      let svg = document.createElementNS(nsURI, "svg");
      svg.setAttribute('viewBox', "0 0 " + width + " " + height)
      container.appendChild(svg);

      let dots = [];

      for (let i = 0; i <= lineAmount; i++) {
        let offset = 0;
        if(i % 2 === 0) {
          offset = dotWidth / 2;
        }

        for (let j = 0; j <= dotAmount; j++) {
          dots.push({ x: ((j * dotWidth) + offset) + dotOffset, y: -2 + i * (dotWidth * dotHeightAdjust) });
        }
      }

      buildConnectors(svg, dots);
    }

    function buildConnectors(container, dots) {
      for (let i = 0; i < dots.length; i++) {
        const dot = dots[i];

        for (let j = 0; j < dots.length; j++) {
          if(getDistance(dot.x, dot.y, dots[j].x, dots[j].y) < (dotWidth + (dotWidth * 0.2)) && dot.y <= dots[j].y) {
            const line = document.createElementNS(nsURI, "line");
            line.setAttribute("x1", dot.x);
            line.setAttribute("y1", dot.y);
            line.setAttribute("x2", dots[j].x);
            line.setAttribute("y2", dots[j].y);
            container.appendChild(line);
          }
        }
      }
    }

    function getDistance(x1, y1, x2, y2) {
      let y = x2 - x1;
      let x = y2 - y1;

      return Math.sqrt(x * x + y * y);
    }

    // event handlers

    function onMouseEnter(event) {
      if(!arrowAnimating) {
        arrowAnimating = true;
        gsap.fromTo(".cta-arrow", {
          x: 0
        }, {
          duration: 0.15,
          x: 5,
          ease: "quad.inOut",
          repeat: 3,
          yoyo: true
        });
      }
    }

    function onMouseLeave(event) {
      arrowAnimating = false;
    }

    // begin the show
    
    window.addEventListener("DOMContentLoaded", init);
  </script>
