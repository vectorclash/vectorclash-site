        #legal-overlay {
			position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
            pointer-events: none;
            background-color: black;
            font-size: 9px;
            font-family: Arial, Helvetica, sans-serif;
            color: white;
            transition: 0.25s;
            container-type: size;
            z-index: 3;
        }
        #legal-overlay > #legal-text-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            overflow-y: auto;
        }
        /* Custom scroll bar styles */
        #legal-overlay > #legal-text-container::-webkit-scrollbar {
            width: 10px;
        }
        #legal-overlay > #legal-text-container::-webkit-scrollbar-track {
            background: #111;
        }
        #legal-overlay > #legal-text-container::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 4px;
            border: 2px solid #111;
        }
        #legal-overlay > #legal-text-container::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
        #legal-overlay > .close {
            position: absolute;
            top: 0px;
            left: 0px;
            padding: 10px;
            width: 15px;
            height: 15px;
            background-color: rgba(0, 0, 0, 0.7);
            border-bottom-right-radius: 5px;
            border-bottom-left-radius: 5px;
            z-index: 1;
        }
        #legal-overlay > .close > svg {
            position: relative;
            width: 100%;
            height: 100%;
            fill: white;
        }
        #legal-overlay > #legal-text-container > .legal-text {
            padding: 10px;
            padding-bottom: 5px;
            margin-top: 30px;
        }
        @container (max-height: 50px) {
            #legal-overlay > .close {
                padding: 12px;
                width: 10px;
                height: 10px;
            }
            #legal-overlay > #legal-text-container > .legal-text {
                padding: 5px;
                margin-top: 0px;
                padding-left: 25px;
            }
        }
        @container (max-height: 90px) {
            #legal-overlay > #legal-text-container > .legal-text {
                padding: 10px;
                margin-top: 0px;
                padding-left: 35px;
            }
        }
        @container (min-width: 900px) {
            #legal-overlay > #legal-text-container > .legal-text {
                padding: 10px;
                margin-top: 0px;
                padding-left: 35px;
                max-width: 80%;
            }
        }
        .legal-animate-in {
            opacity: 1 !important;
            pointer-events: all !important;
        }
	</style>
