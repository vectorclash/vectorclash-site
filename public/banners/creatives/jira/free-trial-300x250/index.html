<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8">
    <style media="screen">
    @font-face {
        font-family: 'charliedisplay_regular';
        src: url('CharlieDisplay-Regular.woff2') format('woff2'),
             url('CharlieDisplay-Regular.woff') format('woff');
        font-weight: normal;
        font-style: normal;
    }

      body {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      .banner {
        position: absolute;
        width: 300px;
        height: 250px;
        overflow: hidden;
        z-index: 9999;
        border: 1px solid #999;
        box-sizing: border-box;
        cursor: pointer;
      }

      .logo {
        position: absolute;
        width: 92px;
        right: 13px;
        bottom: 5px;
        z-index: 200;
      }

      .title-text {
        position: absolute;
        top: 17px;
        width: 100%;
        text-align: center;
        z-index: 100;
        font-family: Helvetica, sans-serif;
        font-family: "charliedisplay_regular", sans-serif;
        font-size: 23px;
        color: #ffffff;
        text-shadow: 3px 3px 50px #040605;
      }

      .cursor {
        position: absolute;
        top: 79px;
        left: 57px;
        z-index: 100;
        font-family: Helvetica, sans-serif;
        font-weight: 700;
        font-size: 10.5px;
        color: #000000;
      }

      .animated-text {
        position: absolute;
        top: 79px;
        left: 57px;
        width: 80px;
        overflow: hidden;
        white-space: nowrap;
        padding-right: 3px;
        border-right: 2px solid rgba(0,0,0,0.75);
        z-index: 100;
        font-family: Helvetica, sans-serif;
        font-weight: 700;
        font-size: 10.5px;
        color: #000000;
      }

      .cta {
        position: absolute;
        bottom: 20px;
        left: 19px;
        font-family: "charliedisplay_regular", sans-serif;
        font-size: 17px;
        line-height: 17px;
        color: white;
        background-color: #ff5630;
        padding: 6px 12px;
        border-radius: 4px;
        z-index: 100;
      }

      .bg {
        position: absolute;
        width: 300px;
        height: 250px;
        background-image: url(bg.png);
        z-index: 0;
      }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/2.0.2/TweenMax.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/2.0.2/plugins/TextPlugin.min.js"></script>
  </head>

    <script>
        var clickTag = 'http://www.atlassian.com/jira'

        function init() {
          var banner = document.querySelector('.banner')

          banner.addEventListener('mouseover', onBannerOver)
          banner.addEventListener('mouseout', onBannerOut)
          banner.addEventListener('click', onBannerClick)

          animate()
        }

        function animate() {
          var tl = new TimelineMax({
            paused:true
          })
          // letter animation
          tl.fromTo(".animated-text", 3, {
            width: "0",
          }, {
            width: "80px",
            ease:  SteppedEase.config(16)
          }, 0)
          // text cursor animation
          tl.fromTo(".animated-text", 0.3, {
            "border-right-color": "rgba(0,0,0,0.75)"
          }, {
            "border-right-color": "rgba(255,255,255,0)",
            repeat: 10,
            ease:  SteppedEase.config(37)
          }, 0)

          tl.play()
        }

        function onBannerOver(event) {
          TweenMax.to('.cta', 0.3, {
            backgroundColor: 0xDE350B
          })
        }

        function onBannerOut(event) {
          TweenMax.to('.cta', 0.2, {
            backgroundColor: 0xFF5630
          })
        }

        function onBannerClick(event) {
          window.open(window.clickTag)
        }

        window.addEventListener('load', init)
    </script>
