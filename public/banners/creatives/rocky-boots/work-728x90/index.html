<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8">
    <style media="screen">
      .banner {
        position: absolute;
        left: 0;
        top: 0;
        width: 728px;
        height: 90px;
        overflow: hidden;
        background-color: #000000;
        cursor: pointer;
      }

      .full-frame-element {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        display: none;
        background-size: 100%;
      }

      .border {
        position: absolute;
        width: 100%;
        height: 100%;
        border: 1px solid black;
        box-sizing: border-box;
        -moz-box-sizing: border-box;
        -webkit-box-sizing: border-box;
        z-index: 100;
      }

      .frame {
        position: absolute;
        width: 100%;
        height: 100%;
      }

      .shoe-bg {
        position: absolute;
        top: 0;
        right: 0;
        width: 800px;
        height: 100%;
        background-image: url(images/bg.jpg);
        z-index: 0;
      }

      .shoe-overlay {
        position: absolute;
        top: 0;
        right: 0;
        width: 800px;
        height: 100%;
        background-image: url(images/shoe-overlay.png);
        z-index: 10;
      }

      .text {
        z-index: 1;
      }

      .text-one {
        background-image: url(images/text-one.png);
        mix-blend-mode: multiply;
        opacity: 0.9;
      }

      .text-two {
        background-image: url(images/text-two.png);
        mix-blend-mode: multiply;
        opacity: 0.9;
      }

      .text-three {
        background-image: url(images/text-three.png);
        mix-blend-mode: multiply;
        opacity: 0.9;
      }

      .end-frame {
        z-index: 12;
      }

      .logo {
        background-image: url(images/logo.png);
        z-index: 1;
      }

      .cta {
        background-image: url(images/cta.png);
        z-index: 1;
      }

      .cta-over {
        display: block;
        opacity: 0;
        background-image: url(images/cta-over.png);
        z-index: 2;
      }
    </style>
    <script>
      var clickTag = 'https://www.rockyboots.com/rocky-xo-toe/'
    </script>
  </head>
  <body>
    <div class="banner">
      <div class="border"></div>
      <div class="shoe-overlay"></div>
      <div class="text frame">
        <div class="text-one full-frame-element"></div>
        <div class="text-two full-frame-element"></div>
        <div class="text-three full-frame-element"></div>
      </div>
      <div class="end-frame frame">
        <div class="logo full-frame-element"></div>
        <div class="cta-over full-frame-element"></div>
        <div class="cta full-frame-element"></div>
      </div>
      <div class="shoe-bg"></div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/2.1.3/TweenMax.min.js"></script>
    <script>
      var banner

      function init() {
        banner = document.querySelector('.banner')

        animate()

        banner.addEventListener('click', onBannerClick)
      }

      function animate() {
        TweenMax.to('.shoe-bg, .shoe-overlay', 10, {
          x: 72,
          ease: Quad.easeInOut
        })

        // animate text frames

        TweenMax.from('.text-one', 1, {
          alpha: 0,
          y: 50,
          ease: Quad.easeInOut,
          onStart: enableElement,
          onStartParams: ['.text-one']
        })

        TweenMax.from('.text-two', 1, {
          alpha: 0,
          y: 50,
          ease: Quad.easeInOut,
          delay: 3,
          onStart: enableElement,
          onStartParams: ['.text-two']
        })

        TweenMax.from('.text-three', 1, {
          alpha: 0,
          y: 50,
          ease: Quad.easeInOut,
          delay: 6,
          onStart: enableElement,
          onStartParams: ['.text-three']
        })

        // animate end frame

        TweenMax.from('.logo', 1, {
          y: 20,
          alpha: 0,
          delay: 11,
          ease: Quad.easeInOut,
          onStart: enableElement,
          onStartParams: ['.logo']
        })

        TweenMax.from('.cta', 1, {
          y: 20,
          alpha: 0,
          delay: 11.5,
          ease: Quad.easeInOut,
          onStart: enableElement,
          onStartParams: ['.cta'],
          onComplete: function() {
            banner.addEventListener('mouseover', onBannerOver)
            banner.addEventListener('mouseout', onBannerOut)
          }
        })
      }

      function enableElement(element) {
        TweenMax.set(element, {
          display: 'block'
        })
      }

      function onBannerOver(event) {
        TweenMax.to('.cta-over', 0.3, {
          alpha: 1
        })
      }

      function onBannerOut(event) {
        TweenMax.to('.cta-over', 0.2, {
          alpha: 0
        })
      }

      function onBannerClick(event) {
        window.open(clickTag)
      }

      window.addEventListener('load', init)
    </script>
  </body>
</html>
