<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8">
    <style media="screen">
      .banner {
        position: absolute;
        left: 0;
        top: 0;
        width: 300px;
        height: 600px;
        overflow: hidden;
        background-color: #FFFFFF;
        cursor: pointer;
      }

      .full-frame-element {
        position: absolute;
        left: 0;
        top: 0;
        width: 300px;
        height: 600px;
        background-size: 300px 600px;
        z-index: 10;
        display: none;
      }

      .frame {
        position: absolute;
        width: 100%;
        height: 100%;
        left: 0;
        top: 0;
        z-index: 10;
        overflow: hidden;
      }

      .border {
        position: absolute;
        width: 100%;
        height: 100%;
        border: 1px solid black;
        box-sizing: border-box;
        -moz-box-sizing: border-box;
        -webkit-box-sizing: border-box;
        z-index: 100;
      }

      img {
        position: absolute;
        left: 0;
        top: 0;
        width: 300px;
        height: 600px;
        display: none;
      }

      #frame-One {
        z-index: 1;
      }

      #frame-two {
        z-index: 0;
      }

      #text-one-upper {
        height: 435px;
        z-index: 5;
      }

      #text-one-lower {
        height: 164px;
        bottom: 0;
        top: auto;
        z-index: 5;
      }

      #text-one-lower img {
        top: auto;
        bottom: 0;
      }

      #text-two-upper {
        height: 435px;
        z-index: 5;
      }

      #bg {
        width: 500px;
        z-index: 0;
      }

      #device-frame {
        z-index: 1;
      }

      #device {
        z-index: 0;
      }

      .device-icon {
        left: 137px;
        top: 228px;
        width: 13px;
        height: 13px;
        z-index: 1;
      }

      #device-frame-end {
        z-index: 1;
      }

      #device-end {
        z-index: 0;
      }

      #logo {
        z-index: 50;
      }

      #logo-end {
        z-index: 50;
      }

      #cta {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        bottom: 60px;
        width: 90px;
        padding: 11px 11px 7px 11px;
        background-color: #444054;
        border: 1px solid #444054;
        display: none;
      }

      #cta path {
        fill: #ffffff;
      }
    </style>
    <script>
      var clickTag = 'https://www.marriott.com'
    </script>
  </head>
  <body>
    <div class="banner">
      <div class="border"></div>
      <div class="frame" id="frame-one">
        <img src="images/logo.png" id="logo">
        <div class="frame" id="device-frame">
          <img src="images/device-icon.png" id="device-icon" class="device-icon">
          <img src="images/device.png" id="device">
        </div>
        <img src="images/bg.jpg" id="bg">
      </div>
      <div class="frame" id="frame-two">
        <img src="images/logo-end.png" id="logo-end">
        <img src="images/line.png" id="line">
        <div class="frame" id="text-one-upper">
          <img src="images/know-then-go.png" id="know-then-go">
        </div>
        <div class="frame" id="text-one-lower">
          <img src="images/track-your-shuttle.png" id="track-your-shuttle">
        </div>
      </div>
      <div class="frame" id="device-frame-end">
        <img src="images/device-icon.png" id="device-icon-end" class="device-icon">
        <img src="images/device.png" id="device-end">
      </div>
      <div class="frame" id="end-frame">
        <div id="cta">

          </svg>
        </div>
        <div class="frame" id="text-two-upper">
          <img src="images/shuttle-tracker.png" id="shuttle-tracker">
        </div>
        <img src="images/line-end.png" id="line-end">
      </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/2.1.3/TweenMax.min.js"></script>
    <script>
      var banner
      var tl = new TimelineMax()
      var iconTl = new TimelineMax()

      function init() {
        banner = document.querySelector('.banner')

        animate()

        banner.addEventListener('click', onBannerClick)
      }

      function animate() {
        // icon timeline is separate

        iconTl.to('.device-icon', 2, {
          x: -31,
          ease: Linear.easeNone
        })

        iconTl.to('.device-icon', 0.5, {
          rotation: -90,
          ease: Linear.easeNone
        }, '-=0.2')

        iconTl.to('.device-icon', 3, {
          y: 43,
          ease: Linear.easeNone
        }, '-=0.1')

        iconTl.to('.device-icon', 0.5, {
          rotation: -180,
          ease: Linear.easeNone
        }, '-=0.2')

        iconTl.to('.device-icon', 6, {
          x: 46,
          ease: Linear.easeNone
        }, '-=0.1')

        iconTl.to('.device-icon', 0.5, {
          rotation: -270,
          ease: Linear.easeNone
        }, '-=0.2')

        iconTl.to('.device-icon', 3, {
          y: 0,
          ease: Linear.easeNone
        }, '-=0.1')

        iconTl.to('.device-icon', 0.5, {
          rotation: -360,
          ease: Linear.easeNone
        }, '-=0.2')

        iconTl.to('.device-icon', 2, {
          x: 20,
          ease: Linear.easeNone
        }, '-=0.1')

        iconTl.duration(15)

        // end icon timeline

        tl.from('#frame-one', 0.5, {
          x: banner.clientWidth,
          ease: Quad.easeInOut,
          onStart: enableElement,
          onStartParams: ['#device, #device-icon, #bg, #logo']
        })

        tl.from('#device-frame, #logo', 0.5, {
          x: 150,
          ease: Quad.easeInOut
        }, '-=0.5')

        tl.to('#bg', 3.5, {
          x: -200,
          ease: Quad.easeInOut
        })

        tl.to('#frame-one', 0.5, {
          x: -banner.clientWidth,
          ease: Quad.easeInOut
        })

        tl.to('#device-frame', 0.5, {
          x: -150,
          ease: Quad.easeInOut
        }, '-=0.5')

        tl.from('#frame-two, #device-frame-end', 0.5, {
          x: banner.clientWidth,
          ease: Quad.easeInOut,
          onStart: enableElement,
          onStartParams: ['#logo-end, #device-end, #device-icon-end']
        }, '-=0.5')

        tl.from('#line', 1, {
          x: -banner.clientWidth,
          ease: Quad.easeInOut,
          onStart: enableElement,
          onStartParams: ['#line']
        }, '-=0.7')

        tl.from('#know-then-go', 0.5, {
          y: 30,
          alpha: 0,
          ease: Back.easeOut,
          onStart: enableElement,
          onStartParams: ['#know-then-go']
        }, '-=0.2')

        tl.from('#track-your-shuttle', 0.5, {
          y: -30,
          alpha: 0,
          ease: Back.easeOut,
          onStart: enableElement,
          onStartParams: ['#track-your-shuttle']
        }, '-=0.1')

        tl.to('#line', 0.5, {
          alpha: 0,
          ease: Quad.easeInOut
        }, '+=2')

        tl.from('#line-end', 0.5, {
          alpha: 0,
          ease: Quad.easeInOut,
          onStart: enableElement,
          onStartParams: ['#line-end']
        }, '-=0.5')

        tl.to('#know-then-go', 0.5, {
          alpha: 0,
          y: 30,
          ease: Quad.easeInOut,
        }, '-=0.5')

        tl.to('#track-your-shuttle', 0.5, {
          alpha: 0,
          y: -30,
          ease: Quad.easeInOut,
        }, '-=0.5')

        tl.from('#shuttle-tracker', 0.5, {
          y: 30,
          alpha: 0,
          ease: Back.easeOut,
          onStart: enableElement,
          onStartParams: ['#shuttle-tracker']
        }, '-=0.2')

        tl.from('#cta', 0.5, {
          scale: 0,
          ease: Back.easeOut,
          onStart: enableElement,
          onStartParams: ['#cta'],
          onComplete: function() {
            banner.addEventListener('mouseover', onBannerOver)
            banner.addEventListener('mouseout', onBannerOut)
          }
        }, '+=0.5')
      }

      function enableElement(element) {
        TweenMax.set(element, {
          display: 'block'
        })
      }

      function onBannerClick(event) {
        window.open(clickTag)
      }

      function onBannerOver(event) {
        TweenMax.to('#cta', 0.3, {
          backgroundColor: 0xFFFFFF,
        })

        TweenMax.to('path', 0.3, {
          fill: 0x444054,
        })
      }

      function onBannerOut(event) {
        TweenMax.to('#cta', 0.2, {
          backgroundColor: 0x444054,
        })

        TweenMax.to('path', 0.2, {
          fill: 0xFFFFFF,
        })
      }

      window.addEventListener('load', init)
    </script>
  </body>
</html>
