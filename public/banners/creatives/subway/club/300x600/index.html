<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="ad.size" content="width=300,height=600">
  <script>
    var clickTag = 'http://www.subway.com'
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/2.1.2/TweenMax.min.js"></script>
  <style>
    body {
      margin: 0 auto;
      padding: 0 auto;
    }

    #banner {
      width: 300px;
      height: 600px;
      background-color: #3f8547;
      margin: 0 auto;
      padding: 0 auto;
    }

    .container {
      position: absolute;
      width: 300px;
      height: 600px;
      overflow: hidden;
      cursor: pointer;
    }

    .border {
      position: absolute;
      width: 100%;
      height: 100%;
      z-index: 100;
      border: 1px solid #7f7f7f;
      box-sizing: border-box;
      -moz-box-sizing: border-box;
      -webkit-box-sizing: border-box;
    }

    .full-frame-element {
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-size: 100%;
      display: none;
    }

    .cover {
      position: absolute;
      width: 100%;
      height: 100%;
      z-index: 4;
    }

    .upper-tear {
      display: block;
      overflow: hidden;
      z-index: 2;
    }

    .upper-tear-back {
      display: block;
      overflow: hidden;
      z-index: 3;
    }

    .upper-tear-back img {
      position: absolute;
      left: 300px;
    }

    .middle-tear {
      display: block;
      overflow: hidden;
      z-index: 0;
    }

    .middle-tear-back {
      display: block;
      overflow: hidden;
      z-index: 1;
    }

    .middle-tear-back img {
      position: absolute;
      left: 300px;
    }

    .lower-tear {
      display: block;
      overflow: hidden;
      z-index: 4;
    }

    .lower-tear-back {
      display: block;
      overflow: hidden;
      z-index: 5;
    }

    .lower-tear-back img {
      position: absolute;
      left: 300px;
    }

    .were-breaking-text {
      display: block;
      background-image: url(images/were-breaking-text.png);
      z-index: 3;
    }

    .logo-small {
      display: block;
      background-image: url(images/logo-small.png);
      z-index: 3;
    }

    .ghosting {
      display: block;
      position: absolute;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.35);
      z-index: 2;
    }

    .sandwiches {
      position: absolute;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .sandwich-text-one {
      background-image: url(images/sandwich-text-one.png);
    }
    .sandwich-text-two {
      background-image: url(images/sandwich-text-two.png);
    }
    .sandwich-text-three {
      background-image: url(images/sandwich-text-three.png);
    }

    .end-frame {
      position: absolute;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    .endframe-text {
      background-image: url(images/endframe-text.png);
      z-index: 10;
    }

    .logo-large {
      background-image: url(images/logo-large.png);
      z-index: 10;
    }

    .cta {
      background-image: url(images/cta.png);
      z-index: 10;
    }

    .cta-over {
      display: block;
      opacity: 0;
      background-image: url(images/cta-over.png);
      z-index: 11;
    }

    .legal-text {
      background-image: url(images/legal-text.png);
      z-index: 10;
    }

    .background {
      display: block;
      background-image: url(images/background.jpg);
      z-index: 1;
    }
</style>
</head>
<body onload="init();" data-size="300x600">
  <div id="banner" class="container">
    <div class="border"></div>
    <div class="cover">
      <div class="upper-tear full-frame-element">
        <img src="images/upper-tear.png">
      </div>
      <div class="upper-tear-back full-frame-element">
        <img src="images/upper-tear-back.png">
      </div>

      <div class="middle-tear full-frame-element">
        <img src="images/middle-tear.png">
      </div>
      <div class="middle-tear-back full-frame-element">
        <img src="images/middle-tear-back.png">
      </div>

      <div class="lower-tear full-frame-element">
        <img src="images/lower-tear.png">
      </div>
      <div class="lower-tear-back full-frame-element">
        <img src="images/lower-tear-back.png">
      </div>
    </div>
    <div class="were-breaking-text full-frame-element"></div>
    <div class="logo-large full-frame-element"></div>
    <div class="logo-small full-frame-element"></div>
    <div class="ghosting"></div>
    <div class="sandwiches">
      <div class="sandwich-text-one full-frame-element"></div>
      <div class="sandwich-text-two full-frame-element"></div>
      <div class="sandwich-text-three full-frame-element"></div>
    </div>
    <div class="end-frame">
      <div class="endframe-text full-frame-element"></div>
      <div class="cta full-frame-element"></div>
      <div class="cta-over full-frame-element"></div>
      <div class="legal-text full-frame-element"></div>
      <div class="background full-frame-element"></div>
    </div>
  </div>
  <script>
    var mainContainer = document.querySelector('#banner')
    function init() {

      // frame 1 to 2

      TweenMax.to('.upper-tear', 1, {
        width: 0,
        ease: Quad.easeOut,
        delay: 1
      })

      TweenMax.to('.upper-tear-back', 1, {
        width: 0,
        ease: Quad.easeOut,
        delay: 1
      })

      TweenMax.to('.upper-tear-back img', 1, {
        x: -600,
        ease: Quad.easeOut,
        delay: 1
      })

      TweenMax.to('.lower-tear', 1, {
        width: 0,
        ease: Quad.easeOut,
        delay: 1
      })

      TweenMax.to('.lower-tear-back', 1, {
        width: 0,
        ease: Quad.easeOut,
        delay: 1
      })

      TweenMax.to('.lower-tear-back img', 1, {
        x: -600,
        ease: Quad.easeOut,
        delay: 1
      })

      // frame 2 to 3

      TweenMax.to('.middle-tear', 1, {
        width: 0,
        ease: Quad.easeOut,
        delay: 3
      })

      TweenMax.to('.middle-tear-back', 1, {
        width: 0,
        ease: Quad.easeOut,
        delay: 3
      })

      TweenMax.to('.middle-tear-back img', 1, {
        x: -600,
        ease: Quad.easeOut,
        delay: 3
      })

      TweenMax.to('.ghosting', 1, {
        alpha: 0,
        ease: Quad.easeOut,
        delay: 3
      })

      TweenMax.to('.were-breaking-text', 0.5, {
        alpha: 0,
        ease: Quad.easeOut,
        delay: 3
      })

      TweenMax.from('.sandwich-text-one', 0.5, {
        y: 20,
        alpha: 0,
        ease: Back.easeOut,
        delay: 3.5,
        onStart: activateElement,
        onStartParams: ['.sandwich-text-one']
      })

      TweenMax.from('.sandwich-text-two', 0.5, {
        y: 20,
        alpha: 0,
        ease: Back.easeOut,
        delay: 4,
        onStart: activateElement,
        onStartParams: ['.sandwich-text-two']
      })

      TweenMax.from('.sandwich-text-three', 0.5, {
        y: 20,
        alpha: 0,
        ease: Back.easeOut,
        delay: 4.5,
        onStart: activateElement,
        onStartParams: ['.sandwich-text-three']
      })

      // frame 3 to 4

      TweenMax.to('.sandwich-text-one', 1, {
        alpha: 0,
        ease: Quad.easeInOut,
        delay: 6
      })

      TweenMax.to('.sandwich-text-two', 1, {
        alpha: 0,
        ease: Quad.easeInOut,
        delay:6
      })

      TweenMax.to('.sandwich-text-three', 1, {
        alpha: 0,
        ease: Quad.easeInOut,
        delay: 6
      })

      TweenMax.to('.logo-small', 1, {
        alpha: 0,
        ease: Quad.easeInOut,
        delay: 6
      })

      // end frame content

      TweenMax.from('.endframe-text', 0.3, {
        scale: 2,
        ease: Elastic.easeOut.config(1, 0.75),
        delay: 7,
        onStart: activateElement,
        onStartParams: ['.endframe-text']
      })

      TweenMax.from('.legal-text', 0.3, {
        alpha: 0,
        ease: Quad.easeOut,
        delay: 7,
        onStart: activateElement,
        onStartParams: ['.legal-text']
      })

      TweenMax.from('.logo-large', 0.3, {
        alpha: 0,
        y: 60,
        ease: Quad.easeOut,
        delay: 8.3,
        onStart: activateElement,
        onStartParams: ['.logo-large']
      })

      TweenMax.from('.cta', 0.3, {
        alpha: 0,
        ease: Quad.easeOut,
        delay: 8,
        onStart: activateElement,
        onStartParams: ['.cta'],
        onComplete: function() {
          mainContainer.addEventListener('mouseover', onBannerOver)
          mainContainer.addEventListener('mouseout', onBannerOut)
        }
      })

      mainContainer.addEventListener('click', onBannerClick)
    }

    function activateElement(element) {
      TweenMax.set(element, {
        display: 'block'
      })
    }

    function onBannerOver(event) {
      TweenMax.to('.cta-over', 0.3, {
        alpha: 1,
        ease: Quad.easeOut
      })
    }

    function onBannerOut(event) {
      TweenMax.to('.cta-over', 0.2, {
        alpha: 0,
        ease: Quad.easeOut
      })
    }

    function onBannerClick(event) {
      window.open(clickTag)
    }
  </script>
</body>
</html>
