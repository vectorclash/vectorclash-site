<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="ad.size" content="width=300,height=250">
  <script>
    var clickTag = 'http://www.subway.com'
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/2.1.2/TweenMax.min.js"></script>
  <style>
    body {
      margin: 0 auto;
      padding: 0 auto;
    }

    #banner {
      width: 300px;
      height: 250px;
      background-color: #3f8547;
      margin: 0 auto;
      padding: 0 auto;
    }

    .container {
      position: absolute;
      width: 300px;
      height: 250px;
      overflow: hidden;
      cursor: pointer;
    }

    .border {
      position: absolute;
      width: 100%;
      height: 100%;
      z-index: 100;
      border: 1px solid #7f7f7f;
      box-sizing: border-box;
      -moz-box-sizing: border-box;
      -webkit-box-sizing: border-box;
    }

    .full-frame-element {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-size: 100%;
      display: none;
    }

    /* individual elements */

    .background {
      display: block;
      background-image: url(images/background.jpg);
      z-index: 1;
    }

    .logo-small {
      display: block;
      background-image: url(images/logo-small.png);
      z-index: 10;
    }

    .logo-large {
      background-image: url(images/logo-large.png);
      z-index: 10;
    }

    .text-one {
      background-image: url(images/text-one.png);
      z-index: 10;
    }

    .text-two {
      background-image: url(images/text-two.png);
      z-index: 10;
    }

    .endframe-text {
      background-image: url(images/endframe-text.png);
      z-index: 10;
    }

    .cta {
      background-image: url(images/cta.png);
      z-index: 10;
    }

    .cta-over {
      display: block;
      opacity: 0;
      background-image: url(images/cta-over.png);
      z-index: 10;
    }

    .legal-text {
      background-image: url(images/legal-text.png);
      z-index: 10;
    }

    .background-end {
      display: block;
      background-image: url(images/background-end.jpg);
      z-index: 0;
    }
</style>
</head>
<body onload="init();" data-size="300x250">
  <div id="banner" class="container">
    <div class="border"></div>
    <div class="logo-small full-frame-element"></div>
    <div class="text-one full-frame-element"></div>
    <div class="text-two full-frame-element"></div>
    <div class="endframe-text full-frame-element"></div>
    <div class="cta full-frame-element"></div>
    <div class="cta-over full-frame-element"></div>
    <div class="logo-large full-frame-element"></div>
    <div class="legal-text full-frame-element"></div>
    <div class="background full-frame-element"></div>
    <div class="background-end full-frame-element"></div>
  </div>
  <script>
    var mainContainer = document.querySelector('#banner')
    function init() {
      animate()

      mainContainer.addEventListener('click', onBannerClick)
    }

    function animate() {
      TweenMax.from('.text-one', 0.3, {
        scale: 2,
        y: 80,
        ease: Elastic.easeOut.config(1, 0.75),
        delay: 1,
        onStart: activateElement,
        onStartParams: ['.text-one']
      })

      TweenMax.to('.text-one', 0.5, {
        alpha: 0,
        ease: Quad.easeInOut,
        delay: 2.5
      })

      TweenMax.from('.background', 1, {
        y: 2,
        scaleX: 1.9,
        scaleY: 1.9,
        ease: Quad.easeInOut,
        delay: 2.5
      })

      TweenMax.from('.text-two', 0.3, {
        scale: 2,
        y: 80,
        ease: Elastic.easeOut.config(1, 0.75),
        delay: 3.5,
        onStart: activateElement,
        onStartParams: ['.text-two']
      })

      TweenMax.to('.text-two', 0.01, {
        alpha: 0,
        ease: Quad.easeInOut,
        delay: 5.5,
      })

      TweenMax.to('.background', 0.01, {
        alpha: 0,
        ease: Quad.easeInOut,
        delay: 5.5,
      })

      TweenMax.to('.logo-small', 0.01, {
        alpha: 0,
        ease: Quad.easeInOut,
        delay: 5.5,
      })

      // end frame content

      TweenMax.from('.endframe-text', 0.3, {
        scale: 2,
        y: 80,
        ease: Elastic.easeOut.config(1, 0.75),
        delay: 6,
        onStart: activateElement,
        onStartParams: ['.endframe-text']
      })

      TweenMax.from('.legal-text', 0.3, {
        alpha: 0,
        ease: Quad.easeOut,
        delay: 6,
        onStart: activateElement,
        onStartParams: ['.legal-text']
      })

      TweenMax.from('.logo-large', 0.3, {
        alpha: 0,
        y: 60,
        ease: Quad.easeOut,
        delay: 7.3,
        onStart: activateElement,
        onStartParams: ['.logo-large']
      })

      TweenMax.from('.cta', 0.3, {
        alpha: 0,
        ease: Quad.easeOut,
        delay: 7,
        onStart: activateElement,
        onStartParams: ['.cta'],
        onComplete: function() {
          mainContainer.addEventListener('mouseover', onBannerOver)
          mainContainer.addEventListener('mouseout', onBannerOut)
        }
      })
    }

    function activateElement(element) {
      TweenMax.set(element, {
        display: 'block'
      })
    }

    function onBannerOver(event) {
      TweenMax.to('.cta-over', 0.3, {
        alpha: 1,
        ease: Quad.easeOut
      })
    }

    function onBannerOut(event) {
      TweenMax.to('.cta-over', 0.2, {
        alpha: 0,
        ease: Quad.easeOut
      })
    }

    function onBannerClick(event) {
      window.open(clickTag)
    }
  </script>
</body>
</html>
