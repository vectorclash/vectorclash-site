<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8">
    <style media="screen">
      .banner {
        position: absolute;
        left: 0;
        top: 0;
        width: 300px;
        height: 250px;
        overflow: hidden;
        background-color: #FFFFFF;
        cursor: pointer;
      }

      .full-frame-element {
        position: absolute;
        left: 0;
        top: 0;
        width: 300px;
        height: 250px;
        display: none;
        background-size: 300px 250px;
        z-index: 10;
      }

      .frame {
        position: absolute;
        width: 100%;
        height: 100%;
        left: 0;
        top: 0;
        z-index: 50;
        overflow: hidden;
      }

      .border {
        position: absolute;
        width: 100%;
        height: 100%;
        border: 1px solid black;
        box-sizing: border-box;
        -moz-box-sizing: border-box;
        -webkit-box-sizing: border-box;
        z-index: 100;
      }

      .bg {
        position: absolute;
        width: 465px;
        height: 600px;
        left: 0;
        top: 0;
        background-image: url(images/bg.jpg);
        z-index: 0;
      }

      .product {
        position: absolute;
        display: none;
        width: 340px;
        height: 192px;
        left: 70px;
        top: 55px;
        transform: scale(0.2);
        background-image: url(images/product.png);
        z-index: 60;
      }

      .end-frame-text {
        background-image: url(images/end-frame-text.png);
      }

      .logo {
        display: block;
        background-image: url(images/logo.png);
        z-index: 50;
      }

      .cta {
        display: block;
        background-image: url(images/cta.png);
        z-index: 50;
      }

      .cta-over {
        display: block;
        background-image: url(images/cta-over.png);
        z-index: 51;
        opacity: 0;
      }

      .text-one {
        background-image: url(images/text-one.png);
        z-index: 10;
      }

      .text-two {
        background-image: url(images/text-two.png);
        z-index: 10;
      }

      .text-three-line-one {
        top: 66px;
        background-image: url(images/text-three-line-one.png);
        z-index: 10;
      }

      .text-three-line-two {
        top: 66px;
        background-image: url(images/text-three-line-two.png);
        z-index: 10;
      }

      .text-three-line-three {
        top: 66px;
        background-image: url(images/text-three-line-three.png);
        z-index: 10;
      }

      .text-shadow {
        background-image: url(images/text-shadow.png);
        mix-blend-mode: multiply;
        z-index: 1;
      }
    </style>
    <script>
      var clickTag = 'https://www.te.com'
    </script>
  </head>
  <body>
    <div class="banner">
      <div class="border"></div>
      <div class="logo full-frame-element"></div>
      <div class="cta-over full-frame-element"></div>
      <div class="cta full-frame-element"></div>
      <div class="product"></div>
      <div class="end-frame-text full-frame-element"></div>
      <div class="text-one full-frame-element"></div>
      <div class="text-two full-frame-element"></div>
      <div class="text-three-line-one full-frame-element"></div>
      <div class="text-three-line-two full-frame-element"></div>
      <div class="text-three-line-three full-frame-element"></div>
      <div class="text-shadow full-frame-element"></div>
      <div class="bg"></div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/2.1.3/TweenMax.min.js"></script>
    <script>
      var banner

      function init() {
        banner = document.querySelector('.banner')

        animate()

        banner.addEventListener('click', onBannerClick)
        banner.addEventListener('mouseover', onBannerOver)
        banner.addEventListener('mouseout', onBannerOut)
      }

      function animate() {
        // frame 1

        TweenMax.to('.bg', 6.5, {
          x: -140,
          ease: Quad.easeInOut
        })

        TweenMax.from('.text-one', 2, {
          width: 0,
          ease: Quad.easeInOut,
          onStart: enableElement,
          onStartParams: ['.text-one']
        })

        TweenMax.from('.text-shadow', 1, {
          alpha: 0,
          ease: Quad.easeInOut,
          onStart: enableElement,
          onStartParams: ['.text-shadow']
        })

        TweenMax.to('.text-one', 2, {
          x: -(banner.clientWidth),
          ease: Quad.easeInOut,
          delay: 3
        })

        // frame 2

        TweenMax.from('.text-two', 3, {
          width: 0,
          ease: Quad.easeInOut,
          delay: 3,
          onStart: enableElement,
          onStartParams: ['.text-two']
        })

        TweenMax.from('.text-two', 2, {
          x: banner.clientWidth,
          ease: Quad.easeInOut,
          delay: 3
        })

        TweenMax.to('.text-shadow', 2, {
          alpha: 0,
          ease: Quad.easeInOut,
          delay: 3
        })

        TweenMax.from('.product', 2, {
          alpha: 0,
          x: 35,
          scale: 0,
          ease: Quad.easeInOut,
          delay: 3,
          onStart: enableElement,
          onStartParams: ['.product']
        })

        TweenMax.to('.bg', 4, {
          alpha: 0,
          scale: 1.3,
          ease: Quad.easeInOut,
          delay: 2
        })

        TweenMax.to('.text-two', 2, {
          x: -(banner.clientWidth),
          ease: Quad.easeInOut,
          delay: 7
        })

        // frame 3

        TweenMax.to('.product', 3, {
          x: -30,
          y: -5,
          scale: 0.7,
          ease: Quad.easeInOut,
          delay: 8
        })

        TweenMax.from('.text-three-line-one', 3, {
          width: 0,
          ease: Quad.easeInOut,
          delay: 7,
          onStart: enableElement,
          onStartParams: ['.text-three-line-one']
        })

        TweenMax.from('.text-three-line-one', 2, {
          x: banner.clientWidth,
          ease: Quad.easeInOut,
          delay: 7
        })

        TweenMax.to('.text-three-line-one', 2, {
          y: -66,
          ease: Quad.easeInOut,
          delay: 9
        })

        TweenMax.to('.text-three-line-two', 2, {
          y: -66,
          ease: Quad.easeInOut,
          delay: 9
        })

        TweenMax.to('.text-three-line-three', 2, {
          y: -66,
          ease: Quad.easeInOut,
          delay: 9
        })

        TweenMax.from('.text-three-line-two', 2, {
          width: 0,
          ease: Quad.easeInOut,
          delay: 9,
          onStart: enableElement,
          onStartParams: ['.text-three-line-two']
        })

        TweenMax.from('.text-three-line-three', 2, {
          width: 0,
          ease: Quad.easeInOut,
          delay: 10,
          onStart: enableElement,
          onStartParams: ['.text-three-line-three']
        })

        TweenMax.from('.end-frame-text', 1, {
          alpha: 0,
          ease: Quad.easeInOut,
          onStart: enableElement,
          delay: 11,
          onStartParams: ['.end-frame-text']
        })
      }

      function enableElement(element) {
        TweenMax.set(element, {
          display: 'block'
        })
      }

      function onBannerClick(event) {
        window.open(clickTag)
      }

      function onBannerOver(event) {
        TweenMax.to('.cta-over', 0.4, {
          alpha: 1
        })
      }

      function onBannerOut(event) {
        TweenMax.to('.cta-over', 0.2, {
          alpha: 0
        })
      }

      window.addEventListener('load', init)
    </script>
  </body>
</html>
