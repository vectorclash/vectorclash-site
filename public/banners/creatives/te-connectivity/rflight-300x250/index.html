<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8">
    <style media="screen">
      .banner {
        position: absolute;
        left: 0;
        top: 0;
        width: 300px;
        height: 250px;
        overflow: hidden;
        background-color: #FFFFFF;
        cursor: pointer;
      }

      .full-frame-element {
        position: absolute;
        left: 0;
        top: 0;
        width: 300px;
        height: 250px;
        display: none;
        background-size: 300px 250px;
        z-index: 10;
      }

      .frame {
        position: absolute;
        width: 100%;
        height: 100%;
        left: 0;
        top: 0;
        z-index: 50;
        overflow: hidden;
      }

      .border {
        position: absolute;
        width: 100%;
        height: 100%;
        border: 1px solid #747678;
        box-sizing: border-box;
        -moz-box-sizing: border-box;
        -webkit-box-sizing: border-box;
        z-index: 100;
      }

      .vehicle {
        position: absolute;
        left: 200px;
        top: 47px;
        width: 256px;
        height: 238px;
        background-image: url(images/vehicle.png);
        z-index: 1;
      }

      .bg {
        position: absolute;
        left: 0;
        top: 0;
        width: 489px;
        height: 250px;
        background-image: url(images/bg.jpg);
        z-index: 0;
      }

      .text-one {
        background-image: url(images/text-one.png);
        z-index: 50;
      }

      .text-two {
        background-image: url(images/text-two.png);
        z-index: 50;
      }

      .text-three {
        background-image: url(images/text-three.png);
        z-index: 50;
      }

      .text-four {
        background-image: url(images/text-four.png);
        z-index: 50;
      }

      .text-five {
        background-image: url(images/text-five.png);
        z-index: 50;
      }

      .logo-left {
        background-image: url(images/logo-left.png);
        z-index: 50;
        transform-origin: 83px 113px;
      }

      .logo-right {
        background-image: url(images/logo-right.png);
        z-index: 50;
        transform-origin: 237px 113px;
      }

      .line {
        display: none;
        position: absolute;
        bottom: 96px;
        left: 167px;
        width: 1px;
        height: 80px;
        transform-origin: bottom;
      }

      .line-back {
        background-color: #06e6f7;
        z-index: 50;
      }

      .line-front {
        background-color: #E98300;
        z-index: 51;
      }

      .cta {
        background-image: url(images/cta.png);
        z-index: 50;
      }

      .cta-over {
        display: block;
        background-image: url(images/cta-over.png);
        z-index: 51;
        opacity: 0;
      }
    </style>
    <script>
      var clickTag = 'https://www.te.com'
    </script>
  </head>
  <body>
    <div class="banner">
      <div class="border"></div>
      <div class="text-elements frame">
        <div class="text-one full-frame-element"></div>
        <div class="text-two full-frame-element"></div>
        <div class="text-three full-frame-element"></div>
        <div class="text-four full-frame-element"></div>
        <div class="text-five full-frame-element"></div>
      </div>
      <div class="end-frame frame">
        <div class="logo-left full-frame-element"></div>
        <div class="logo-right full-frame-element"></div>
        <div class="line-front line"></div>
        <div class="line-back line"></div>
        <div class="cta-over full-frame-element"></div>
        <div class="cta full-frame-element"></div>
      </div>
      <div class="vehicle"></div>
      <div class="bg"></div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/2.1.3/TweenMax.min.js"></script>
    <script>
      var banner

      function init() {
        banner = document.querySelector('.banner')

        animate()

        banner.addEventListener('click', onBannerClick)
      }

      function animate() {
        TweenMax.to('.bg', 8, {
          x: -189,
          ease: Quad.easeOut
        })

        TweenMax.to('.vehicle', 6, {
          x: -300,
          ease: Linear.easeNone
        })

        TweenMax.to('.vehicle', 6, {
          scale: 0,
          y: -110,
          ease: Linear.easeNone
        })

        TweenMax.to('.vehicle', 1, {
          alpha: 0,
          ease: Quad.easeInOut,
          delay: 5,
        })

        var vblur = {blur: 0}

        TweenMax.to(vblur, 2, {
          blur: 10,
          ease: Quad.easeIn,
          delay: 4,
          onUpdate: function() {
            TweenMax.set('.vehicle', {
              filter: 'blur(' + vblur.blur + 'px)'
            })
          }
        })

        // text elements

        var textTL = new TimelineMax()

        textTL.from('.text-one', 0.4, {
          alpha: 0,
          ease: Quad.easeInOut,
          yoyo: true,
          repeat: 1,
          repeatDelay: 0.4,
          onStart: enableElement,
          onStartParams: ['.text-one']
        })

        textTL.from('.text-two', 0.4, {
          alpha: 0,
          ease: Quad.easeInOut,
          yoyo: true,
          repeat: 1,
          repeatDelay: 0.8,
          onStart: enableElement,
          onStartParams: ['.text-two']
        })

        textTL.from('.text-three', 0.4, {
          alpha: 0,
          ease: Quad.easeInOut,
          yoyo: true,
          repeat: 1,
          repeatDelay: 0.8,
          onStart: enableElement,
          onStartParams: ['.text-three']
        })

        textTL.from('.text-four', 0.4, {
          alpha: 0,
          ease: Quad.easeInOut,
          yoyo: true,
          repeat: 1,
          repeatDelay: 1.5,
          onStart: enableElement,
          onStartParams: ['.text-four']
        })

        textTL.from('.text-five', 0.4, {
          alpha: 0,
          ease: Quad.easeInOut,
          yoyo: true,
          repeat: 1,
          repeatDelay: 1.5,
          onStart: enableElement,
          onStartParams: ['.text-five']
        })

        textTL.to('.bg, .vehicle', 1, {
          alpha: 0,
          ease: Quad.easeInOut
        }, '-= 0.5')

        textTL.from('.line-back', 1, {
          height: 0,
          ease: Quad.easeInOut,
          onStart: enableElement,
          onStartParams: ['.line-back']
        })

        textTL.from('.line-front', 1, {
          height: 0,
          ease: Quad.easeInOut,
          onStart: enableElement,
          onStartParams: ['.line-front']
        }, '-= 0.9')

        textTL.from('.logo-left', 0.5, {
          rotation: 180,
          scale: 0.5,
          alpha: 0,
          x: 50,
          y: 20,
          ease: Quad.easeInOut,
          onStart: enableElement,
          onStartParams: ['.logo-left']
        }, '-= 0.5')

        textTL.from('.logo-right', 0.5, {
          rotation: -180,
          scale: 0.5,
          alpha: 0,
          x: -50,
          y: 20,
          ease: Quad.easeInOut,
          onStart: enableElement,
          onStartParams: ['.logo-right']
        }, '-= 0.5')

        textTL.from('.cta', 1, {
          y: 100,
          ease: Quad.easeInOut,
          onStart: enableElement,
          onStartParams: ['.cta'],
          onComplete: function() {
            banner.addEventListener('mouseover', onBannerOver)
            banner.addEventListener('mouseout', onBannerOut)
          }
        })
      }

      function animateTextElement(element, delay) {
        console.log(element.className.split(' ')[0], 'is animating on at ' + delay)
        TweenMax.from(element, 0.5, {
          alpha: 0,
          ease: Quad.easeInOut,
          delay: delay,
          yoyo: true,
          repeat: 1,
          repeatDelay: 1.5,
          onStart: enableElement,
          onStartParams: [element]
        })
      }

      function enableElement(element) {
        TweenMax.set(element, {
          display: 'block'
        })
      }

      function onBannerClick(event) {
        window.open(clickTag)
      }

      function onBannerOver(event) {
        TweenMax.to('.cta-over', 0.4, {
          alpha: 1
        })
      }

      function onBannerOut(event) {
        TweenMax.to('.cta-over', 0.2, {
          alpha: 0
        })
      }

      window.addEventListener('load', init)
    </script>
  </body>
</html>
