<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover, so the page is laid out across the whole screen
         rather than inside the safe areas. Without it iOS insets the layout
         viewport past the status bar and the home indicator, and the study's
         sticky canvas ends at those insets instead of running under Safari's
         chrome -- the scene stopped at a grey strip top and bottom. Content is
         kept clear of the insets by .container's padding, which adds the safe
         area to its own. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#CCFF00" />

    <!-- Inline so the very first paint is already the page's base tone. As a
         rule in the bundled stylesheet it only applies once that file has been
         fetched, and the browser shows its default white until then.

         The brand colour rather than a neutral, because this is also the colour
         Safari's toolbars take. Safari samples the page at its top and bottom
         edges instead of reading theme-color, and the hero's gradient fades up
         from transparent over 900ms -- so for the whole of that window the page
         really is this value, and so are the bars. It matches theme-color above
         for the browsers that still read the meta.

         On iOS this outlives the load. viewport-fit=cover lays the page out
         under Safari's chrome, so the bars sit over the safe areas -- which are
         outside the viewport, and the gradient below is pinned to the viewport.
         It does not paint there. What is behind the bars is this flat colour,
         for the whole of the session and not just the first 900ms. It is not a
         fallback; it is the value, and it does not move.

         The same reach is why the scrollbar gutter is lime: it too is outside
         the viewport the gradient is pinned to. That edge is wanted, so it is
         kept, and the scrollbar's thumb is darkened against it in index.css
         rather than the ground being changed here.

         The gradient over it is what the eye gets, and every stop of it is
         dark. The flat colour alone held the whole screen at full brightness
         until the bundle parsed and the hero mounted, and the hero's palettes
         are weighted dark -- so the page opened on a bright flood and then
         dropped away from it. This is the same 42deg the hero uses, in the
         register the hero usually lands in, so the real palette crossfades
         over it rather than replacing it. Safari reads the colour rather than
         the image, which is why the brand value stays declared above even
         though nothing on a desktop shows it.

         background-attachment matters as much as the stops. A background on
         the root is painted across the whole document, not the viewport, and
         this document is many screens tall -- so an unpinned gradient spends
         its whole length on the scroll and the top of the page shows only the
         far end of it. Pinning it to the viewport is what makes it the one
         screenful it is drawn to be. -->
    <style>
      /* Declared as a property because three places paint it: the root, the
         bundled stylesheet's copy of this rule, and the hero, which covers the
         root as soon as React mounts and has to hand over to the real palette
         without a change of ground. One value, defined before the first
         paint. */
      :root {
        --load-gradient: linear-gradient(42deg, #0f1405 0%, #1d2a08 55%, #33470b 100%);
      }

      html {
        background-color: #CCFF00;
        background-image: var(--load-gradient);
        background-attachment: fixed;
      }
    </style>

    <title>VECTORCLASH | Aaron Ezra Sterczewski, Design Engineer</title>
    <meta

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Moved here from an @import at the top of App.scss, which the browser
         could not discover until that stylesheet had downloaded and parsed.
         Left render-blocking on purpose: deferring it (media="print" swap) only
         bought ~35ms of first paint, and it delays when the font files are
         requested. The hero splits its headline on document.fonts.ready,
         which already resolves early (before React has mounted any text), so
         the split leans on the timeline's 1s delay for the faces to arrive --
         no reason to make that window tighter than it is. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Exo:ital,wght@0,100..900;1,100..900&family=Quicksand:wght@300..700&display=swap"
    />
