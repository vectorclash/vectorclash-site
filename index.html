<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#CCFF00" />

    <!-- Inline so the very first paint is already the page's base tone. As a
         rule in the bundled stylesheet it only applies once that file has been
         fetched, and the browser shows its default white until then. -->
    <style>
      html { background-color: #333333; }
    </style>

    <title>VECTORCLASH | Aaron Ezra Sterczewski, Design Engineer</title>
    <meta
      name="description"
      content="VECTORCLASH is the portfolio of Aaron Ezra Sterczewski, a design engineer building interactive, animated interfaces with React, GSAP, and three.js for brands including Microsoft, Walmart, Atlassian, and Gap."
    />
    <meta name="author" content="Aaron Ezra Sterczewski" />
    <link rel="canonical" href="https://vectorclash.com/" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Moved here from an @import at the top of App.scss, which the browser
         could not discover until that stylesheet had downloaded and parsed.
         Left render-blocking on purpose: deferring it (media="print" swap) only
         bought ~35ms of first paint, and it delays when the font files are
         requested. The hero splits its headline on document.fonts.ready,
         which already resolves early (before React has mounted any text), so
         the split leans on the timeline's 1s delay for the faces to arrive --
         no reason to make that window tighter than it is. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Exo:ital,wght@0,100..900;1,100..900&family=Quicksand:wght@300..700&display=swap"
    />

    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="VECTORCLASH" />
    <meta property="og:url" content="https://vectorclash.com/" />
    <meta
      property="og:title"
      content="VECTORCLASH | Aaron Ezra Sterczewski, Design Engineer"
    />
    <meta
      property="og:description"
      content="The portfolio of Aaron Ezra Sterczewski, a design engineer building interactive, animated interfaces with React, GSAP, and three.js."
    />
    <meta property="og:image" content="https://vectorclash.com/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The VECTORCLASH mark, a white circle over a burst of overlapping neon geometric shapes."
    />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="VECTORCLASH | Aaron Ezra Sterczewski, Design Engineer"
    />
    <meta
      name="twitter:description"
      content="The portfolio of Aaron Ezra Sterczewski, a design engineer building interactive, animated interfaces with React, GSAP, and three.js."
    />
    <meta name="twitter:image" content="https://vectorclash.com/og-image.jpg" />
    <meta
      name="twitter:image:alt"
      content="The VECTORCLASH mark, a white circle over a burst of overlapping neon geometric shapes."
    />

    <script type="application/ld+json">

            "@type": "WebSite",
            "@id": "https://vectorclash.com/#website",

            "name": "VECTORCLASH",
            "description": "The portfolio of Aaron Ezra Sterczewski, design engineer.",
            "inLanguage": "en",
            "publisher": { "@id": "https://vectorclash.com/#aaron" }
          },
          {
            "@type": "Person",
            "@id": "https://vectorclash.com/#aaron",
            "name": "Aaron Ezra Sterczewski",
            "url": "https://vectorclash.com/",
            "image": "https://vectorclash.com/og-image.jpg",
            "email": "mailto:aaron@vectorclash.com",
            "jobTitle": "Design Engineer",
            "description": "Design engineer building interactive, animated interfaces and real-time 3D for the web.",
            "knowsAbout": [
              "Design Engineering",
              "React",
              "GSAP",
              "three.js",
              "React Three Fiber",
              "WebGL",
              "Motion Design",
              "Motion Graphics",

              "https://www.linkedin.com/in/aaronezra/",
              "https://bsky.app/profile/vectorclash.bsky.social"
            ]
          }
        ]
      }
    </script>
  </head>
